services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: pbx-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pbx
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - backend_net
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: pbx-api
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped

  pbx:
    build:
      context: ./pbx
      dockerfile: Dockerfile
    image: pbx-asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10050:10000-10050/udp" # Example Asterisk RTP Port range
    networks:
      - backend_net
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: pbx-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - frontend_net
    restart: unless-stopped

networks:
  frontend_net:
  backend_net:

volumes:
  db-data:
